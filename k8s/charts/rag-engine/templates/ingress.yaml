{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rag.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rag.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # /metrics must never be public. Snippet annotations are disabled in modern ingress-nginx
          # (CVE-2021-25742), so route the exact path to a Service with no endpoints -> 503.
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: {{ include "rag.fullname" . }}-blackhole
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rag.fullname" . }}-api
                port:
                  name: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag.fullname" . }}-blackhole
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  # no selector => no endpoints => ingress answers 503 for anything routed here
  ports:
    - port: 80
      targetPort: 80
{{- end }}

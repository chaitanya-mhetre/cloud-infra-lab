# Hooks (weight -10) so config, secret, PVC and service account exist before the migration Job.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rag.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- if not .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rag.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rag.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rag.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rag.fullname" . }}-uploads
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rag.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-10"
    helm.sh/resource-policy: keep   # never delete uploaded documents on uninstall
spec:
  accessModes: [{{ .Values.uploads.accessMode }}]
  {{- with .Values.uploads.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.uploads.size }}

{{- $sel := include "rag.selector" (dict "root" . "component" "api") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- $sel | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: {{- $sel | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      {{- include "rag.pod" (dict "root" .) | nindent 6 }}
      containers:
        - name: api
          command: {{- toYaml .Values.api.command | nindent 12 }}
          ports:
            - { name: http, containerPort: {{ .Values.api.port }} }
          {{- include "rag.container" (dict "root" .) | nindent 10 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /v1/health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /v1/health, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /v1/ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector: {{- $sel | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rag.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- $sel | nindent 6 }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rag.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rag.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }} }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}

{{- if .Values.migrations.enabled }}
# Runs `alembic upgrade head` once per install/upgrade, BEFORE new pods roll out.
# If it fails, Helm aborts the upgrade and the old ReplicaSet keeps serving (expand/contract migrations).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "slotwise.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels: {{- include "slotwise.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels: {{- include "slotwise.selector" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "slotwise.fullname" . }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "slotwise.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{- toYaml .Values.migrations.command | nindent 12 }}
          envFrom: {{- include "slotwise.envFrom" . | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes: {{- include "slotwise.tmpVolume" . | nindent 8 }}
{{- end }}
